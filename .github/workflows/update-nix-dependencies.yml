name: Update Nix dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-nix-dependencies
  cancel-in-progress: false

jobs:
  update:
    name: Update and validate flake inputs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake inputs
        run: nix flake update --flake path:./nix

      - name: Validate shell scripts
        run: bash -n scripts/install.sh scripts/post-install.sh scripts/bootstrap-macos.sh

      - name: Check flake
        run: nix flake check path:./nix --no-build

      - name: Evaluate macOS configuration
        run: >-
          nix eval --raw
          path:./nix#darwinConfigurations.macos.config.system.build.toplevel.drvPath

      - name: Check diff
        run: git diff --check

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: nix/flake.lock
          branch: automation/update-nix-dependencies
          commit-message: "chore: update Nix dependencies"
          delete-branch: true
          title: "chore: update Nix dependencies"
          body: |
            Automated weekly update of the pinned Nix flake inputs.

            The workflow validated the shell scripts, flake evaluation, macOS
            configuration derivation, and resulting diff before opening this PR.
